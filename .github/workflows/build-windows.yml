name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One main build at a time, so two quick merges can't race to commit the exe.
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build WeekNumber.exe
        shell: pwsh
        env:
          APP_VERSION: 1.0.${{ github.run_number }}
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: WeekNumber
          path: WeekNumber.exe
          if-no-files-found: error
      # The app updates itself from the latest release: the exe plus its SHA-256.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: 1.0.${{ github.run_number }}
        run: |
          $hash = (Get-FileHash WeekNumber.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$PWD/WeekNumber.exe.sha256", "$hash  WeekNumber.exe`n")
          gh release create "v$env:APP_VERSION" WeekNumber.exe WeekNumber.exe.sha256 `
            --target $env:GITHUB_SHA --title "WeekNumber $env:APP_VERSION" --notes "Built from $env:GITHUB_SHA"
      # Keep the newest WeekNumber.exe in main, replacing the previous one.
      # Pushes made with GITHUB_TOKEN don't trigger workflows, so this doesn't loop.
      - name: Commit WeekNumber.exe to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WeekNumber.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "WeekNumber.exe unchanged"; exit 0 }
          git commit -m "Update WeekNumber.exe to $($env:GITHUB_SHA.Substring(0, 7))"
          git push origin HEAD:main
